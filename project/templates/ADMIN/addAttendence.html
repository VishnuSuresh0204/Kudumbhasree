{% extends 'ADMIN/adminCommon.html' %}
{% load static %}
{% block content %}
    
    <section class="hero-wrap hero-wrap-2" style="background-image: url(/static/images/kkb.webp);" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text js-fullheight align-items-end">
          <div class="col-md-9 ftco-animate pb-5">
          	<p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home <i class="fa fa-chevron-right"></i></a></span> <span>Add Attendence<i class="fa fa-chevron-right"></i></span></p>
            <h1 class="mb-3 bread">Add Attendence</h1>
          </div>
        </div>
      </div>
    </section>
    
	  <section class="ftco-section contact-section">
      <div class="container">
        <div class="row block-9 justify-content-center mb-5">
          <div class="col-md-8 mb-md-5">
            <h1 style="margin-left: 200px;">Add Attendence</h1>
            <form class="bg-light p-5 contact-form" method="post" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="form-group">
                <select name="user" class="form-control" required>
                    <option value="" selected disabled>Select User</option>
                    {% for i in users %}
                    <option value="{{i.id}}">{{i.Username}}</option>
                    {% endfor %}
                </select>
              </div>
              <div class="form-group">
                <input type="date" class="form-control" name="date" id="datePicker" required>
              </div>
              <div class="form-group">
               <select name="status" class="form-control" required>
                <option value="" selected disabled>Select Attendence Status</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
               </select>
              </div>
              <div class="form-group">
                <input type="submit" value="Add" class="btn btn-primary py-3 px-5">
              </div>
            </form>
          	<!-- <h2 class="text-center mt-5">If you got any questions please do not hesitate to send us a message</h2> -->
          </div>
        </div>
      </div>
    </section>	
    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const today = new Date().toISOString().split('T')[0];
          const dateInput = document.getElementById("datePicker");
          dateInput.min = today;   
          dateInput.value = today;  
        });
      </script>
      
    {% endblock %}
