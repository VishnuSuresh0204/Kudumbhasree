{% extends 'ADMIN/adminCommon.html' %}
{% load static %}
{% block content %}
    
    <section class="hero-wrap hero-wrap-2" style="background-image: url(/static/images/kkb.webp);" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text js-fullheight align-items-end">
          <div class="col-md-9 ftco-animate pb-5">
          	<p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home <i class="fa fa-chevron-right"></i></a></span> <span>Loan Duration<i class="fa fa-chevron-right"></i></span></p>
            <h1 class="mb-3 bread">Loan Duration</h1>
          </div>
        </div>
      </div>
    </section>
    
	  <section class="ftco-section contact-section">
      <div class="container">
        <div class="row block-9 justify-content-center mb-5">
          <div class="col-md-8 mb-md-5">
            <h1 style="margin-left: 200px;">Loan Duration</h1>
            <form class="bg-light p-5 contact-form" method="post">
              {% csrf_token %}
              <div class="form-group">
                <input type="text" class="form-control" value="{{ loan.amount }}" readonly>
              </div>
              <div class="form-group">
                <input type="number" class="form-control" name="duration_weeks" placeholder="Set Duration (in weeks)" min="1" required>
              </div>
              <div class="form-group">
                <input type="submit" value="Add" class="btn btn-primary py-3 px-5">
              </div>
            </form>
          	<!-- <h2 class="text-center mt-5">If you got any questions please do not hesitate to send us a message</h2> -->
          </div>
        </div>
      </div>
    </section>	
      
    {% endblock %}
