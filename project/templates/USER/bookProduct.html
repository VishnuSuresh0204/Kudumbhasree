{% extends 'USER/userCommon.html' %}
{% block content %}


<section class="hero-wrap hero-wrap-2" style="background-image: url(/static/images/kkb.webp);" data-stellar-background-ratio="0.5">
    <div class="overlay"></div>
    <div class="container">
      <div class="row no-gutters slider-text js-fullheight align-items-end">
        <div class="col-md-9 ftco-animate pb-5">
          <p class="breadcrumbs">
            <span class="mr-2"><a href="index.html">Home <i class="fa fa-chevron-right"></i></a></span>
            <span>Book Product<i class="fa fa-chevron-right"></i></span>
          </p>
          <h1 class="mb-3 bread">Book Product</h1>
        </div>
      </div>
    </div>
  </section>

<section class="ftco-section contact-section">
  <div class="container">
    <h2 class="text-center mb-4">Book Product</h2>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" class="form-control" value="{{ product.product_name }}" readonly>
      </div>

      <div class="form-group">
        <label>Price per unit (₹)</label>
        <input type="text" class="form-control" value="{{ product.product_price }}" readonly>
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <input type="number" name="quantity" min="1" value="1" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success mt-3">Confirm Booking</button>
    </form>
  </div>
</section>

{% endblock %}
