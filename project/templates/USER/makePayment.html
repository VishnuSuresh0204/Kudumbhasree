{% extends 'USER/userCommon.html' %}
{% load static %}

{% block content %}

<style>
  .payment-container {
    padding: 80px 0;
    background: #f8f9fa;
    min-height: 100vh;
  }

  .atm-card {
    background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
    border-radius: 20px;
    padding: 30px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    margin-bottom: 30px;
  }

  .card-chip {
    width: 60px;
    height: 45px;
    background: linear-gradient(135deg, #d4af37 0%, #f9e27c 100%);
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .card-number {
    font-family: 'Courier New', Courier, monospace;
    font-size: 24px;
    letter-spacing: 4px;
    margin-bottom: 30px;
  }

  .card-info {
    display: flex;
    justify-content: space-between;
  }

  .info-label {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.6);
  }

  .info-value {
    font-size: 16px;
  }

  .payment-form-card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  .form-control-custom {
    border-radius: 10px;
    padding: 12px;
  }

  .btn-pay {
    background: #f4a3b1;
    border: none;
    color: white;
    padding: 15px;
    border-radius: 50px;
    width: 100%;
  }
</style>

<div class="payment-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <!-- Card Preview -->
        <div class="atm-card">
          <div class="card-chip"></div>
          <div class="card-number" id="preview-number">**** **** **** ****</div>
          <div class="card-info">
            <div>
              <div class="info-label">Card Holder</div>
              <div class="info-value" id="preview-name">YOUR NAME</div>
            </div>
            <div>
              <div class="info-label">Expires</div>
              <div class="info-value" id="preview-expiry">MM/YY</div>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="payment-form-card">
          <h4>Enter Card Details</h4>

          <form method="post" id="payment-form" onsubmit="return validateExpiry()">
            {% csrf_token %}

            <input type="hidden" name="loan_id" value="{{ loan.id }}">
            <input type="hidden" name="week_number" value="{{ week_number }}">

            <!-- Name -->
            <div class="form-group">
              <label>Cardholder Name</label>
              <input type="text" name="card_name" class="form-control form-control-custom"
                required id="input-name">
            </div>

            <!-- Card Number -->
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" name="card_number" class="form-control form-control-custom"
                maxlength="19" required id="input-number"
                placeholder="0000 0000 0000 0000">
            </div>

            <!-- Expiry + CVV -->
            <div class="row">
              <div class="col-6">
                <label>Expiry</label>
                <input type="text" name="expiry" id="input-expiry"
                  class="form-control form-control-custom"
                  placeholder="MM/YY"
                  maxlength="5"
                  required
                  pattern="(0[1-9]|1[0-2])\/\d{2}">
              </div>

              <div class="col-6">
                <label>CVV</label>
                <input type="password" name="cvv"
                  class="form-control form-control-custom"
                  maxlength="3"
                  required>
              </div>
            </div>

            <button type="submit" class="btn btn-pay mt-3">
              Confirm Payment
            </button>

          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// Live Preview
const inputNumber = document.getElementById('input-number');
const inputName = document.getElementById('input-name');
const inputExpiry = document.getElementById('input-expiry');

inputNumber.addEventListener('input', (e) => {
  let val = e.target.value.replace(/\D/g, '').substring(0,16);
  let formatted = val.match(/.{1,4}/g)?.join(' ') || '';
  e.target.value = formatted;
  document.getElementById('preview-number').textContent = formatted || '**** **** **** ****';
});

inputName.addEventListener('input', (e) => {
  document.getElementById('preview-name').textContent = e.target.value || 'YOUR NAME';
});

inputExpiry.addEventListener('input', (e) => {
  let val = e.target.value.replace(/\D/g, '').substring(0,4);
  if (val.length >= 2) {
    val = val.substring(0,2) + '/' + val.substring(2);
  }
  e.target.value = val;
  document.getElementById('preview-expiry').textContent = val || 'MM/YY';
});

// ✅ FIXED VALIDATION
function validateExpiry() {
  const expiry = document.getElementById('input-expiry').value;

  if (!expiry.match(/^\d{2}\/\d{2}$/)) {
    Swal.fire({
      icon: 'error',
      title: 'Invalid Format',
      text: 'Invalid expiry format'
    });
    return false;
  }

  let [month, year] = expiry.split('/').map(Number);

  const today = new Date();
  let currentMonth = today.getMonth() + 1;
  let currentYear = today.getFullYear() % 100;

  if (month < 1 || month > 12) {
    Swal.fire({
      icon: 'error',
      title: 'Invalid Month',
      text: 'Invalid month'
    });
    return false;
  }

  if (year < currentYear || (year === currentYear && month < currentMonth)) {
    Swal.fire({
      icon: 'error',
      title: 'Expired',
      text: 'Card expired'
    });
    return false;
  }

  return true; // ✅ only valid goes through
}
</script>

{% endblock %}
