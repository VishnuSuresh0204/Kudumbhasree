{% extends 'common.html' %}
{% load static %}


{% block content %}
    
<section class="hero-wrap hero-wrap-2" style="background-image: url(/static/images/kkb.webp);" data-stellar-background-ratio="0.5">
  <div class="overlay"></div>
  <div class="container">
    <div class="row no-gutters slider-text js-fullheight align-items-end">
      <div class="col-md-9 ftco-animate pb-5">
        <p class="breadcrumbs">
          <span class="mr-2"><a href="index.html">Home <i class="fa fa-chevron-right"></i></a></span> 
          <span>User Register<i class="fa fa-chevron-right"></i></span>
        </p>
        <h1 class="mb-3 bread">User Register</h1>
      </div>
    </div>
  </div>
</section>
    
<section class="ftco-section contact-section">
  <div class="container">
    <div class="row block-9 justify-content-center mb-5">
      <div class="col-md-8 mb-md-5">

        <h1 style="margin-left: 200px;">User Registration</h1>

        <form class="bg-light p-5 contact-form" method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Username -->
          <div class="form-group">
            <input type="text" class="form-control" name="username"
              placeholder="Your Name"
              minlength="2"
              maxlength="50"
              required>
          </div>

          <!-- Email -->
          <div class="form-group">
            <input type="email" class="form-control" name="email"
              placeholder="Your Email"
              required>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <input type="text" class="form-control" name="phone"
              placeholder="Phone Number"
              pattern="[6789][0-9]{9}"
              maxlength="10"
              title="Please enter a valid 10-digit Indian phone number starting with 6, 7, 8, or 9"
              required>
          </div>

          <!-- Password -->
          <div class="form-group">
            <input type="password" class="form-control" name="password"
              placeholder="Password"
              minlength="6"
              required>
          </div>

          <!-- Image -->
          <div class="form-group">
            <input type="file" class="form-control" name="img"
              accept="image/*"
              required>
          </div>

          <!-- Address -->
          <div class="form-group">
            <textarea cols="30" rows="4" name="address"
              class="form-control"
              placeholder="Address"
              minlength="5"
              maxlength="200"
              required></textarea>
          </div>

          <!-- Submit -->
          <div class="form-group">
            <input type="submit" value="Register" class="btn btn-primary py-3 px-5">
          </div>

        </form>

      </div>
    </div>
  </div>
</section>	

{% endblock %}
